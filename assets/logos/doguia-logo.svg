<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ícone do Robô (Esquerda) -->
  <g transform="translate(10, 5)">
    <!-- Corpo externo (azul claro) -->
    <rect x="0" y="0" width="60" height="50" rx="12" fill="#58C6EF" />
    <rect x="0" y="0" width="58" height="50" rx="12" fill="#3AB5E1" /> <!-- Sombra/Profundidade -->
    <!-- Moldura branca interna -->
    <rect x="4" y="4" width="50" height="42" rx="8" fill="#FFFFFF" />
    <!-- Tela preta -->
    <rect x="8" y="8" width="42" height="34" rx="4" fill="#18181A" />
    <!-- Olhos (Azul neon brilhante) -->
    <circle cx="21" cy="25" r="5" fill="#00FFFF" filter="drop-shadow(0 0 4px #00FFFF)" />
    <circle cx="39" cy="25" r="5" fill="#00FFFF" filter="drop-shadow(0 0 4px #00FFFF)" />
    <!-- Câmera superior central -->
    <circle cx="29" cy="12" r="1.5" fill="#18181A" />
    <!-- Ícone de Wi-Fi pequeno (canto superior direito da tela preta) -->
    <path d="M42 14 C44 14, 46 15, 47 16" stroke="#00FFFF" stroke-width="1.2" stroke-linecap="round" />
    <path d="M40 16 C43 14, 46 16, 48 18" stroke="#00FFFF" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="44" cy="20" r="1" fill="#00FFFF" />
  </g>

  <!-- Texto "Dogu" (Azul Marinho Escuro) -->
  <g transform="translate(80, 42)" fill="#112A46" font-family="'Inter', sans-serif" font-weight="800" font-size="38">
    <text x="0" y="0">Dogu</text>
  </g>

  <!-- Texto "IA" (Azul Claro) -->
  <g transform="translate(182, 42)" fill="#2BB5DD" font-family="'Inter', sans-serif" font-weight="800" font-size="38">
    <text x="0" y="0">IA</text>
  </g>
</svg>
